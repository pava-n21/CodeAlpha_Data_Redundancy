<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Redundancy Removal System</title>

    <!-- CSS is directly inside the static folder -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Data Redundancy Removal System</h1>

        <p class="subtitle">
            Validate records and prevent duplicate data from being stored.
        </p>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <div class="card">

            <h2>Add New Record</h2>

            <form action="/submit" method="POST">

                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter full name"
                    required
                >

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    required
                >

                <label for="phone">Phone Number</label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    required
                >

                <button type="submit">
                    Validate & Add Record
                </button>

            </form>

        </div>

        <div class="links">

            <a href="/records">
                View Stored Records
            </a>

        </div>

    </div>

</body>

</html>
